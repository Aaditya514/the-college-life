server:
  port: 8080

spring:
  application:
    name: the-college-life-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  mail:
    host: ${SPRING_MAIL_HOST:smtp-relay.brevo.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://192.168.0.106:4200}
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:604800000}

collegelife:
  seed-data: ${SEED_DATA:true}
  mail:
    resend:
      api-key: ${RESEND_API_KEY:}
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:no-reply@thecollegelife.app}
  moderation:
    mode: ${MODERATION_MODE:HYBRID} # HYBRID, LOCAL_ONLY
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
