name: Full-Stack CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Backend Verification Job (Spring Boot / Maven)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Test & Build (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run Unit Tests
        working-directory: backend
        run: mvn clean test -B

  # ----------------------------------------------------------------------------
  # Frontend Verification Job (Angular 19 / Node)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

  # ----------------------------------------------------------------------------
  # Android Mobile Verification Job (Gradle Wrapper)
  # ----------------------------------------------------------------------------
  android-ci:
    name: Android Build & Test (Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Tests & Assemble Debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew test assembleDebug --no-daemon
