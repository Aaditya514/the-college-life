<div class="app-layout" [class.auth-layout]="isAuthRoute()">
  @if (!isAuthRoute()) {
    <app-sidebar></app-sidebar>
  }
  <div class="app-content-wrapper" [class.no-sidebar]="isAuthRoute()">
    <main class="site-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Global Spill a Story Popover Modal -->
@if (!isAuthRoute()) {
  <app-create-modal></app-create-modal>
}
